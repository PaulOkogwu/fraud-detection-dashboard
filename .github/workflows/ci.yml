name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and import check
        run: |
          python -m py_compile main.py app.py
          python -c "import src.data_loader, src.features, src.model, src.model_comparison, src.explainability; print('import-check-ok')"

      - name: Run tests
        run: pytest tests/
